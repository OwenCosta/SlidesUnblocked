<!DOCTYPE html>
<html>
<head><base target="_top">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px system-ui,-apple-system,sans-serif;background:#fff;color:#202124}
  header{display:flex;gap:6px;padding:8px;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:150px;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
  select,button{padding:6px 10px;border:1px solid #ccc;background:#f5f5f5;border-radius:4px;
                cursor:pointer;font-size:12px;color:inherit}
  button:hover{background:#e8eaed}
  #status{font-size:11px;color:#666;padding:5px 8px;min-height:15px;word-break:break-word}
  #stage{position:relative;padding-top:56.25%;background:#000;display:none;overflow:hidden}
  #stage iframe,#stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  #stage.theater{position:fixed;inset:0;padding-top:0;z-index:99}
  #stage.theater iframe,#stage.theater video{position:absolute;inset:0}
  #stage:fullscreen{padding-top:0}
  #stage:fullscreen iframe,#stage:fullscreen video{position:absolute;inset:0}
  .fail{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
        align-items:center;justify-content:center;color:#eee;font-size:13px;text-align:center;padding:20px}
  #bar{display:none;gap:6px;padding:6px 8px;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;background:#fafafa}
  #bar.show{display:flex}
  #results{max-height:190px;overflow-y:auto;padding:4px 8px 8px}
  .card{display:flex;gap:8px;padding:6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
  .card:hover{background:#f1f3f4;border-color:#dadce0}
  .thumb{width:76px;flex:0 0 76px;aspect-ratio:16/9;background:#e8eaed;border-radius:3px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{flex:1;min-width:0;font-size:12px;line-height:1.35}
  .meta b{display:block;font-weight:500;max-height:34px;overflow:hidden}
  .meta i{display:block;font-style:normal;font-size:11px;color:#5f6368;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 8px}
  .chip{font-size:11px;padding:3px 8px;border:1px solid #dadce0;border-radius:12px;
        cursor:pointer;max-width:190px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#fff}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5f6368;margin:8px 8px 4px}
  pre{font-size:11px;white-space:pre-wrap;background:#f5f5f5;border:1px solid #e0e0e0;
      border-radius:4px;margin:6px 8px;padding:8px;max-height:150px;overflow:auto}
  .lbl{font-size:11px;color:#5f6368;align-self:center}
</style>
</head>
<body>
<header>
  <input id="q" type="text" placeholder="Search, or paste a video / shorts URL">
  <button id="go">Search</button>
  <button id="diagBtn" title="Test connections">?</button>
</header>
<div id="status">Ready.</div>
<div id="stage"></div>
<div id="bar">
  <button id="full">Fullscreen</button>
  <button id="theater">Theater</button>
  <button id="retry">Retry</button>
  <button id="next">Other domain</button>
  <button id="stream">Stream</button>
  <button id="pop">Pop out</button>
  <button id="save">Save</button>
  <button id="copy">Copy link</button>
  <span class="lbl">Region</span>
  <select id="gl">
    <option value="US">US</option>
    <option value="GB">UK</option>
    <option value="CA">Canada</option>
    <option value="AU">Australia</option>
    <option value="">Auto</option>
  </select>
  <span class="lbl">Quality</span>
  <select id="itag">
    <option value="18">360p</option>
    <option value="22">720p</option>
  </select>
</div>
<h2>Saved</h2>
<div class="chips" id="saved"></div>
<h2>Recent</h2>
<div class="chips" id="recent"></div>
<pre id="diagOut" style="display:none"></pre>
<div id="results"></div>
<script>
const DOMAINS = [
  {n: 'No-cookie', host: 'https://www.youtube-nocookie.com/embed/'},
  {n: 'YouTube',   host: 'https://www.youtube.com/embed/'}
];

/* stream fallback — serves the media file, so 151 videos still play */
const STREAM = [
  'https://inv.nadeko.net/latest_version',
  'https://invidious.nerdvpn.de/latest_version',
  'https://yewtu.be/latest_version',
  'https://inv.tux.pizza/latest_version'
];

const YT_KEY = 'AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8';
const CLIENTS = [
  {clientName: 'WEB', clientVersion: '2.20241126.01.00', hl: 'en', gl: 'US'},
  {clientName: 'MWEB', clientVersion: '2.20241126.01.00', hl: 'en', gl: 'US'},
  {clientName: 'ANDROID', clientVersion: '19.45.36', androidSdkVersion: 30, hl: 'en', gl: 'US'}
];

function textOf(n) {
  if (!n) return '';
  if (n.simpleText) return n.simpleText;
  if (n.runs) return n.runs.map(r => r.text).join('');
  return '';
}

function collect(node, out) {
  if (!node || typeof node !== 'object' || out.length >= 20) return;
  if (Array.isArray(node)) { node.forEach(n => collect(n, out)); return; }
  if (node.videoId && (node.title || node.headline)) {
    const t = textOf(node.title) || textOf(node.headline);
    if (t) {
      out.push({
        id: node.videoId,
        title: t,
        author: textOf(node.ownerText) || textOf(node.longBylineText) || textOf(node.shortBylineText) || '',
        length: (node.lengthText && node.lengthText.simpleText) || ''
      });
      return;
    }
  }
  for (const k in node) if (node[k] && typeof node[k] === 'object') collect(node[k], out);
}

async function searchHere(q) {
  for (const c of CLIENTS) {
    try {
      const r = await fetch('https://youtubei.googleapis.com/youtubei/v1/search?key=' + YT_KEY, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=UTF-8'},
        body: JSON.stringify({context: {client: c}, query: q})
      });
      if (!r.ok) continue;
      const out = [];
      collect(await r.json(), out);
      if (out.length) return out;
    } catch (e) {}
  }
  return [];
}

function serverSearch(q) {
  return new Promise(resolve => {
    let tries = 0;
    const run = () => {
      tries++;
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          if (tries < 3) { setTimeout(run, 400); return; }
          resolve({ err: err && err.message ? err.message : String(err) });
        })
        .searchVideos(q);
    };
    run();
  });
}

const statusEl = document.getElementById('status');
const stage = document.getElementById('stage');
const results = document.getElementById('results');
const bar = document.getElementById('bar');
const glSel = document.getElementById('gl');
const itagSel = document.getElementById('itag');
const diagOut = document.getElementById('diagOut');

let cur = null, mode = 'embed', dIdx = 0, sIdx = 0, itag = '18', timer = null;

glSel.value = localStorage.getItem('su_gl') || 'US';
itag = localStorage.getItem('su_itag') || '18';
itagSel.value = itag;

glSel.onchange = () => {
  localStorage.setItem('su_gl', glSel.value);
  if (cur) load();
};
itagSel.onchange = () => {
  itag = itagSel.value;
  localStorage.setItem('su_itag', itag);
  sIdx = 0;
  if (cur && mode === 'stream') loadStream();
};

const status = t => statusEl.textContent = t;

function vidOf(x) {
  const m = x.match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(x) ? x : null;
}

function buildUrl(id, domainIdx) {
  const p = new URLSearchParams({
    autoplay: '1',
    rel: '0',
    modestbranding: '1',
    playsinline: '1',
    iv_load_policy: '3',
    fs: '1',
    hl: 'en',
    enablejsapi: '1'
  });
  const gl = localStorage.getItem('su_gl');
  if (gl) p.set('gl', gl);
  if (/^https?:/.test(location.origin)) p.set('origin', location.origin);
  p.set('t', String(Date.now() % 100000));
  return DOMAINS[domainIdx].host + id + '?' + p.toString();
}

function play(id, title) {
  cur = {id: id, title: title || ''};
  mode = 'embed';
  dIdx = 0;
  results.innerHTML = '';
  stage.style.display = 'block';
  bar.classList.add('show');
  pushRecent(cur);
  load();
}

function load() {
  clearTimeout(timer);
  if (!cur) return;
  if (mode === 'stream') return loadStream();

  const d = DOMAINS[dIdx];
  stage.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = buildUrl(cur.id, dIdx);
  f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
  f.setAttribute('allowfullscreen', '');
  f.onload = () => {
    clearTimeout(timer);
    status('Playing via ' + d.n + '. Error 151 or blank? It switches to the stream by itself.');
  };
  stage.appendChild(f);
  status('Loading via ' + d.n + '\u2026');

  timer = setTimeout(() => {
    if (dIdx === 0) { dIdx = 1; load(); }
    else status('Still nothing. Try Stream, another Region, or Pop out.');
  }, 9000);
}

function startStream(reason) {
  mode = 'stream';
  sIdx = 0;
  status((reason ? reason + ' \u2014 ' : '') + 'switched to direct stream');
  loadStream();
}

function loadStream() {
  clearTimeout(timer);
  if (!cur) return;

  if (sIdx >= STREAM.length) {
    if (itag !== '18') {
      itag = '18';
      itagSel.value = '18';
      sIdx = 0;
      return loadStream();
    }
    stage.innerHTML = '<div class="fail"><span>No stream instance answered.</span>' +
      '<button onclick="popout()">Open in a new tab</button></div>';
    status('Stream fallback exhausted. Try Pop out.');
    return;
  }

  const host = STREAM[sIdx];
  const gl = localStorage.getItem('su_gl');
  const url = host + '?id=' + encodeURIComponent(cur.id) + '&itag=' + itag + '&local=true' +
    (gl ? '&region=' + gl : '');

  stage.innerHTML = '';
  const v = document.createElement('video');
  v.controls = true;
  v.autoplay = true;
  v.playsInline = true;
  v.src = url;
  v.onerror = () => { sIdx++; loadStream(); };
  v.onloadedmetadata = () => {
    status('Direct stream via ' + host.split('/')[2] + ' (' + itag + '). ' +
      'No captions or quality menu here.');
  };
  stage.appendChild(v);
  status('Stream ' + (sIdx + 1) + '/' + STREAM.length + '\u2026');
}

function popout() {
  if (!cur) return;
  const url = mode === 'stream'
    ? STREAM[0] + '?id=' + encodeURIComponent(cur.id) + '&itag=' + itag
    : buildUrl(cur.id, dIdx);
  window.open(url, '_blank', 'noopener');
}

/* catch 101 / 150 / 151 from the player itself */
window.addEventListener('message', e => {
  if (!/youtube(-nocookie)?\.com$/.test(String(e.origin).replace(/^https?:\/\//, ''))) return;
  let d;
  try { d = JSON.parse(e.data); } catch (err) { return; }
  if (!d || d.event !== 'onError') return;
  if (d.info === 101 || d.info === 150 || d.info === 151) {
    startStream('Embedding disabled (error ' + d.info + ')');
  } else if (d.info === 100) {
    status('Video is private or removed.');
  } else if (d.info === 2) {
    status('Bad video id.');
  }
});

function card(v) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = '<div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/' + v.id +
    '/mqdefault.jpg"></div><div class="meta"><b></b><i></i></div>';
  d.querySelector('img').onerror = function () { this.parentNode.style.display = 'none'; };
  d.querySelector('b').textContent = v.title;
  d.querySelector('i').textContent = [v.author, v.length].filter(Boolean).join(' \u00b7 ');
  d.onclick = () => play(v.id, v.title);
  return d;
}

function render(list) {
  results.innerHTML = '';
  if (!list || !list.length) {
    status('No results. Paste a direct link instead, or hit ? to test connections.');
    return;
  }
  status(list.length + ' results');
  list.forEach(v => results.appendChild(card(v)));
}

function readLS(k) {
  try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; }
}
function writeLS(k, a) { localStorage.setItem(k, JSON.stringify(a.slice(0, 25))); }

function paintChips(k, el) {
  el.innerHTML = '';
  readLS(k).forEach(v => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = v.title || v.id;
    c.title = v.title || v.id;
    c.onclick = () => play(v.id, v.title);
    el.appendChild(c);
  });
}

function pushRecent(v) {
  const a = readLS('su_recent').filter(x => x.id !== v.id);
  a.unshift(v);
  writeLS('su_recent', a);
  paintChips('su_recent', document.getElementById('recent'));
}

document.getElementById('go').onclick = async () => {
  const raw = document.getElementById('q').value.trim();
  if (!raw) return;
  const id = vidOf(raw);
  if (id) { play(id); return; }

  diagOut.style.display = 'none';
  results.innerHTML = '';
  status('Searching\u2026');

  const res = await serverSearch(raw);
  if (Array.isArray(res) && res.length) { render(res); return; }

  const local = await searchHere(raw);
  if (local.length) { render(local); return; }

  if (res && res.err) {
    status('Search failed: ' + res.err + ' — hit ? for diagnostics.');
  } else {
    status('No results from either path. Paste a direct link instead.');
  }
};

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go').click();
});

document.getElementById('diagBtn').onclick = async () => {
  diagOut.style.display = 'block';
  diagOut.textContent = 'Browser path\u2026';
  const local = await searchHere('music');
  diagOut.textContent = 'browser search: ' + local.length + ' results\nServer path\u2026';
  const res = await serverSearch('music');
  if (Array.isArray(res)) {
    diagOut.textContent += ' ' + res.length + ' results\n\n';
    google.script.run
      .withSuccessHandler(lines => { diagOut.textContent += lines.join('\n'); })
      .withFailureHandler(err => {
        diagOut.textContent += 'diag() failed: ' + (err && err.message ? err.message : err);
      })
      .diag();
  } else {
    diagOut.textContent += ' failed: ' + (res && res.err ? res.err : 'unknown');
  }
};

document.getElementById('full').onclick = () => {
  if (document.fullscreenElement) return document.exitFullscreen();
  const fn = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (fn) fn.call(stage).catch(popout); else popout();
};

document.getElementById('theater').onclick = () => stage.classList.toggle('theater');
document.getElementById('retry').onclick = () => load();
document.getElementById('stream').onclick = () => { sIdx = 0; startStream('Manual'); };
document.getElementById('next').onclick = () => {
  if (mode === 'stream') { sIdx++; loadStream(); return; }
  dIdx = dIdx === 0 ? 1 : 0;
  load();
};
document.getElementById('pop').onclick = popout;

document.getElementById('save').onclick = () => {
  if (!cur) return;
  const a = readLS('su_saved').filter(x => x.id !== cur.id);
  a.unshift(cur);
  writeLS('su_saved', a);
  paintChips('su_saved', document.getElementById('saved'));
  status('Saved.');
};

document.getElementById('copy').onclick = () => {
  if (!cur) return;
  const url = 'https://youtu.be/' + cur.id;
  navigator.clipboard.writeText(url)
    .then(() => status('Copied ' + url))
    .catch(() => status(url));
};

paintChips('su_saved', document.getElementById('saved'));
paintChips('su_recent', document.getElementById('recent'));
