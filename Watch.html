<html>
<head><base target="_top">
<script>
window.onerror = function (m, s, l) {
  var e = document.getElementById('status');
  if (e) {
    e.style.color = '#c62828';
    e.textContent = 'Script error: ' + m + ' (line ' + l + '), paste likely truncated';
  }
};
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px system-ui,-apple-system,sans-serif;background:#fff;color:#202124}
  header{display:flex;gap:6px;padding:8px;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:150px;padding:7px 9px;border:1px solid #ccc;border-radius:4px;font-size:14px}
  button{padding:7px 11px;border:1px solid #ccc;background:#f5f5f5;border-radius:4px;
         cursor:pointer;font-size:12px;color:inherit}
  button:hover{background:#e8eaed}
  #status{font-size:11px;color:#666;padding:5px 8px;min-height:15px;word-break:break-word}
  #results{max-height:330px;overflow-y:auto;padding:4px 8px 8px}
  .card{display:flex;gap:8px;padding:6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
  .card:hover{background:#f1f3f4;border-color:#dadce0}
  .thumb{width:76px;flex:0 0 76px;aspect-ratio:16/9;background:#e8eaed;border-radius:3px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{flex:1;min-width:0;font-size:12px;line-height:1.35}
  .meta b{display:block;font-weight:500;max-height:34px;overflow:hidden}
  .meta i{display:block;font-style:normal;font-size:11px;color:#5f6368;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 8px}
  .chip{font-size:11px;padding:3px 8px;border:1px solid #dadce0;border-radius:12px;
        cursor:pointer;max-width:190px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#fff}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5f6368;margin:8px 8px 4px}
  pre{font-size:11px;white-space:pre-wrap;background:#f5f5f5;border:1px solid #e0e0e0;
      border-radius:4px;margin:6px 8px;padding:8px;max-height:150px;overflow:auto}
  .credit{font-size:10px;color:#80868b;padding:0 8px 8px}
</style>
</head>
<body>
<header>
  <input id="q" type="text" placeholder="Search a video, or paste a link">
  <button id="go">Search</button>
  <button id="diagBtn" title="Test connections">?</button>
</header>
<div id="status">Starting...</div>
<h2>Saved</h2>
<div class="chips" id="saved"></div>
<h2>Recent</h2>
<div class="chips" id="recent"></div>
<pre id="diagOut" style="display:none"></pre>
<div id="results"></div>
<div class="credit">Slides Unblocked · OwenCosta · github.com/OwenCosta/SlidesUnblocked</div>
<script>
const YT_KEY = 'AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8';
const CLIENTS = [
  {clientName: 'WEB', clientVersion: '2.20241126.01.00', hl: 'en', gl: 'US'},
  {clientName: 'MWEB', clientVersion: '2.20241126.01.00', hl: 'en', gl: 'US'},
  {clientName: 'ANDROID', clientVersion: '19.45.36', androidSdkVersion: 30, hl: 'en', gl: 'US'}
];

const byId = id => document.getElementById(id);
const statusEl = byId('status');
const resultsEl = byId('results');
const diagOut = byId('diagOut');

function say(t, bad) {
  if (!statusEl) return;
  statusEl.style.color = bad ? '#c62828' : '#666';
  statusEl.textContent = t;
}

function bind(id, ev, fn) {
  const n = byId(id);
  if (!n) return;
  n.addEventListener(ev, e => {
    Promise.resolve()
      .then(() => fn(e))
      .catch(err => say('Error: ' + (err && err.message ? err.message : err), true));
  });
}

function textOf(n) {
  if (!n) return '';
  if (n.simpleText) return n.simpleText;
  if (n.runs) return n.runs.map(r => r.text).join('');
  return '';
}

function collect(node, out) {
  if (!node || typeof node !== 'object' || out.length >= 20) return;
  if (Array.isArray(node)) { node.forEach(n => collect(n, out)); return; }
  if (node.videoId && (node.title || node.headline)) {
    const t = textOf(node.title) || textOf(node.headline);
    if (t) {
      out.push({
        id: node.videoId,
        title: t,
        author: textOf(node.ownerText) || textOf(node.longBylineText) || textOf(node.shortBylineText) || '',
        length: (node.lengthText && node.lengthText.simpleText) || ''
      });
      return;
    }
  }
  for (const k in node) if (node[k] && typeof node[k] === 'object') collect(node[k], out);
}

async function searchHere(q) {
  for (const c of CLIENTS) {
    try {
      const r = await fetch('https://youtubei.googleapis.com/youtubei/v1/search?key=' + YT_KEY, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=UTF-8'},
        body: JSON.stringify({context: {client: c}, query: q})
      });
      if (!r.ok) continue;
      const out = [];
      collect(await r.json(), out);
      if (out.length) return out;
    } catch (e) {}
  }
  return [];
}

function serverSearch(q) {
  return new Promise(resolve => {
    let tries = 0;
    const run = () => {
      tries++;
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          if (tries < 3) { setTimeout(run, 400); return; }
          resolve({ err: err && err.message ? err.message : String(err) });
        })
        .searchVideos(q);
    };
    run();
  });
}

/* the insert is retried because the channel is often cold on the first call */
function serverPlay(id, title) {
  return new Promise(resolve => {
    let tries = 0;
    const run = () => {
      tries++;
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          if (tries < 4) { setTimeout(run, 500); return; }
          resolve({ ok: false, msg: (err && err.message ? err.message : String(err)) + ' (4 tries)' });
        })
        .playVideo(id, title);
    };
    run();
  });
}

function vidOf(x) {
  const m = x.match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(x) ? x : null;
}

async function play(v) {
  say('Putting "' + (v.title || v.id) + '" on the player slide...');
  const r = await serverPlay(v.id, v.title || '');
  if (r && r.ok) {
    say('Playing on slide ' + r.n + '. Hit present.');
    setTimeout(() => { try { google.script.host.close(); } catch (e) {} }, 700);
  } else {
    say('Insert failed: ' + ((r && r.msg) || 'unknown') + '. Reopen the dialog and retry.', true);
  }
}

function playTracked(v) {
  pushRecent(v);
  play(v);
}

function card(v) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = '<div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/' + v.id +
    '/mqdefault.jpg"></div><div class="meta"><b></b><i></i></div>';
  d.querySelector('img').onerror = function () { this.parentNode.style.display = 'none'; };
  d.querySelector('b').textContent = v.title;
  d.querySelector('i').textContent = [v.author, v.length].filter(Boolean).join(' · ');
  d.onclick = () => playTracked(v);
  return d;
}

function render(list) {
  resultsEl.innerHTML = '';
  if (!list || !list.length) {
    say('No results. Try different words, or paste a link.');
    return;
  }
  say(list.length + ' results. Click one to play it.');
  list.forEach(v => resultsEl.appendChild(card(v)));
}

function readLS(k) {
  try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; }
}
function writeLS(k, a) { localStorage.setItem(k, JSON.stringify(a.slice(0, 25))); }

function paintChips(k, elm) {
  elm.innerHTML = '';
  readLS(k).forEach(v => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = v.title || v.id;
    c.title = v.title || v.id;
    c.onclick = () => playTracked(v);
    elm.appendChild(c);
  });
}

function pushRecent(v) {
  const a = readLS('su_recent').filter(x => x.id !== v.id);
  a.unshift(v);
  writeLS('su_recent', a);
  paintChips('su_recent', byId('recent'));
}

async function doSearch() {
  const raw = byId('q').value.trim();
  if (!raw) { byId('q').focus(); say('Type something to search.'); return; }

  const id = vidOf(raw);
  if (id) { playTracked({id: id, title: ''}); return; }

  diagOut.style.display = 'none';
  resultsEl.innerHTML = '';
  say('Searching...');

  const local = await searchHere(raw);
  if (local.length) { render(local); return; }

  say('Direct search unavailable, trying the server...');
  const res = await serverSearch(raw);
  if (Array.isArray(res) && res.length) { render(res); return; }

  const why = res && res.err ? res.err : 'empty response';
  say('Search failed: ' + why + '. Hit ? for diagnostics.', true);
}

bind('go', 'click', doSearch);
bind('q', 'keydown', e => { if (e.key === 'Enter') doSearch(); });

bind('diagBtn', 'click', async () => {
  diagOut.style.display = 'block';
  diagOut.textContent = 'Browser path...';
  const local = await searchHere('music');
  diagOut.textContent = 'browser search: ' + local.length + ' results\nServer path...';
  const res = await serverSearch('music');
  if (Array.isArray(res)) {
    diagOut.textContent += ' ' + res.length + ' results\n\n';
    google.script.run
      .withSuccessHandler(lines => { diagOut.textContent += lines.join('\n'); })
      .withFailureHandler(err => {
        diagOut.textContent += 'diag() failed: ' + (err && err.message ? err.message : err);
      })
      .diag();
  } else {
    diagOut.textContent += ' failed: ' + (res && res.err ? res.err : 'unknown');
  }
});

/* boot: warm the channel, then self-test search */
try {
  const need = ['q','go','status','results','saved','recent','diagOut','diagBtn'];
  const missing = need.filter(id => !byId(id));
  if (missing.length) {
    say('Broken paste, missing: ' + missing.join(', '), true);
  } else {
    paintChips('su_saved', byId('saved'));
    paintChips('su_recent', byId('recent'));
    byId('q').focus();

    google.script.run
      .withSuccessHandler(() => {})
      .withFailureHandler(() => {})
      .ping();

    (async () => {
      const probe = await searchHere('music');
      if (probe.length) say('Ready. Self-test: ' + probe.length + ' results. Search a video.');
      else say('Ready. Self-test found nothing, search may need the server. Hit ? if unsure.');
    })();
  }
} catch (e) {
  say('Boot error: ' + e.message, true);
}
</script>
</body>
</html>
